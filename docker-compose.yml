services:
  postgres:
    image: postgres:17
    container_name: kolesokz-postgres
    environment:
      POSTGRES_DB: kolesokz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kolesokz"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: kolesokz-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kolesokz
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:

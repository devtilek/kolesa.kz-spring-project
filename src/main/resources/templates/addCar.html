<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
>
<div layout:fragment="arguments">
    <form th:action="@{'/addCar'}" method="post">
        <div class="mb-3">
            <label  class="form-label">Car's Name</label>
            <input type="text" class="form-control" name="name">
        </div>
        <div class="mb-3">
            <label  class="form-label">Car's Price</label>
            <input type="number" class="form-control" name="price">
        </div>
        <div class="mb-3">
            <label  class="form-label">Car's Description</label>
            <input type="text" class="form-control" name="desc">
        </div>
        <div class="mb-3">
            <select name="country_id">
                <option th:each="countryFlag : ${countries}" th:value="${countryFlag.id}" th:text="${countryFlag.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Car's Photo URL</label>
            <textarea class="form-control" rows="3" name="url"></textarea>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary">
                Add Car
            </button>
        </div>
    </form>
</div>
</html>

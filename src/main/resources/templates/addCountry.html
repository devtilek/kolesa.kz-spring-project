<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
>
<div layout:fragment="arguments">
    <form th:action="@{/addCountry}" method="post">
        <div class="mb-3">
            <label  class="form-label">Enter Country Name</label>
            <input type="text" class="form-control" name="name">
        </div>
        <div class="mb-3">
            <label class="form-label">Enter Country URL</label>
            <textarea class="form-control" rows="3" name="url"></textarea>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary">
                Add Country
            </button>
        </div>
    </form>
</div>
</html>

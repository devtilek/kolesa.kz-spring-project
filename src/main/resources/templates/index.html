<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
>
<div class="mt-4" layout:fragment="arguments">
    <style>
        .card-card{
            height: 100%;
        }
        .car-image {
            height: 220px;
            object-fit: cover;
        }
    </style>
    <div class="row" >
        <div class="col-sm-3" th:if="${cars != null}" th:each="car : ${cars}">
            <div class="card card-card" style="width: 18rem;">
                <img th:src="${car.url}" class="card-img-top car-image" alt="...">
                <div class="card-body">
                    <h5 class="card-title" th:text="${car.name}"></h5>
                    <p class="card-text" th:text="${car.description}"></p>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span th:text="${car.country.name}"></span>
                        <img th:src="${car.country.url}" alt="..." width="100">
                    </li>
                    <li class="list-group-item" th:text="${car.price}"></li>
                </ul>
                <div class="card-body">
                    <a th:href="@{'/update/' + ${car.id}}" class="btn btn-primary">Details</a>
                </div>
            </div>
        </div>
    </div>

</div>
</html>
